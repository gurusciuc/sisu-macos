[package]
name = "sisu-core"
version = "0.1.0-alpha.7"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "sisu_core"
crate-type = ["rlib", "staticlib"]

[features]
default = ["mac-core"]
mac-core = ["adblock/content-blocking"]

[dependencies]
prost = "0.14.6"
ring = "0.17.14"
spki = "0.7.3"
zip = { version = "9.7.0", default-features = false, features = ["deflate"] }
sha2 = "0.10"
adblock = { version = "=0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "css-validation"] }
html5gum = "=0.9.1"
psl = "=2.1.255"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[build-dependencies]
adblock = { version = "=0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "css-validation", "content-blocking"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
strip = "debuginfo"

[[bin]]
name = "webkit-rules"
path = "src/bin/webkit-rules.rs"
required-features = ["mac-core"]
